name: Validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check required build outputs exist
        run: |
          for f in dist/manifest.json dist/popup.html dist/popup.css dist/popup.js dist/scan.html dist/scan.css dist/scan.js dist/icons/icon16.png dist/icons/icon32.png dist/icons/icon48.png dist/icons/icon128.png; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
          echo "build outputs present"
