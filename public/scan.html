<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Keylet — Scan QR</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="scan.css" />
</head>
<body class="scan-body">
  <!-- LOCK VIEW (shown when vault is configured but locked) -->
  <div id="lockView" class="scan-lock hidden">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>Unlock Keylet</h2>
      <p class="muted">Enter your master password to import scanned accounts.</p>
      <input id="lockPassword" type="password" placeholder="Master password" autocomplete="off" />
      <div id="lockError" class="error hidden"></div>
      <button id="lockSubmitBtn" class="primary-btn">Unlock</button>
      <button id="lockCancelBtn" class="ghost-btn">Cancel</button>
    </div>
  </div>

  <!-- SCAN VIEW -->
  <div id="scanWrap" class="scan-wrap">
    <h1>Scan QR code</h1>
    <p class="scan-sub">Point your camera at a Google Authenticator export or 2FA setup QR.</p>

    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="video-frame"></div>
    </div>

    <div id="scanStatus" class="status">Requesting camera…</div>

    <div id="preview" class="import-preview hidden"></div>
    <div id="scanNote" class="note hidden"></div>

    <div class="scan-actions">
      <button id="cancelBtn" class="ghost-btn">Cancel</button>
      <button id="rescanBtn" class="ghost-btn hidden">Scan again</button>
      <button id="confirmBtn" class="primary-btn hidden"></button>
    </div>
  </div>

  <script src="scan.js"></script>
</body>
</html>
