<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Keylet</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- LOCK VIEW (setup + unlock + change password share this markup) -->
  <div id="lockView" class="view">
    <div class="lock-card">
      <div class="lock-icon" id="lockIcon">🔒</div>
      <h2 id="lockTitle">Unlock Keylet</h2>
      <p id="lockSubtitle" class="muted">Enter your master password</p>

      <input id="lockPassword" type="password" placeholder="Master password" autocomplete="off" />
      <input id="lockPasswordConfirm" type="password" placeholder="Confirm master password" autocomplete="off" class="hidden" />

      <div id="lockError" class="error hidden"></div>

      <button id="lockSubmitBtn" class="primary-btn">Unlock</button>
      <button id="lockResetBtn" class="link-btn hidden">Forgot password? Reset everything</button>
    </div>
  </div>

  <!-- LIST VIEW -->
  <div id="listView" class="view">
    <div class="topbar">
      <span class="title">Keylet</span>
      <button id="importBtn" class="icon-btn" title="Import from QR">⇪</button>
      <button id="addBtn" class="icon-btn" title="Add account">+</button>
      <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
      <button id="lockBtn" class="icon-btn" title="Lock now">🔒</button>
    </div>
    <div id="accountList" class="account-list"></div>
    <div id="emptyState" class="empty hidden">
      <div class="empty-icon">🔐</div>
      <div class="empty-text">No accounts yet.</div>
      <button id="emptyAddBtn" class="link-btn">Add your first account</button>
    </div>
  </div>

  <!-- FORM VIEW -->
  <div id="formView" class="view hidden">
    <div class="topbar">
      <button id="backBtn" class="icon-btn" title="Back">‹</button>
      <span class="title" id="formTitle">Add account</span>
      <span class="spacer"></span>
    </div>

    <div class="form">
      <label class="field">
        <span class="field-label">otpauth:// URL</span>
        <textarea id="otpauthInput" rows="3" placeholder="otpauth://totp/Issuer:user@example.com?secret=...&issuer=Issuer"></textarea>
        <button id="parseBtn" class="ghost-btn">Parse</button>
      </label>

      <div class="or">— or fill manually —</div>

      <label class="field">
        <span class="field-label">Issuer</span>
        <input id="issuerInput" type="text" placeholder="e.g. Google" />
      </label>
      <label class="field">
        <span class="field-label">Label / Account</span>
        <input id="labelInput" type="text" placeholder="e.g. user@example.com" />
      </label>
      <label class="field">
        <span class="field-label">Secret (Base32)</span>
        <input id="secretInput" type="text" placeholder="e.g. JBSWY3DPEHPK3PXP" autocomplete="off" spellcheck="false" />
      </label>
      <div class="row">
        <label class="field half">
          <span class="field-label">Digits</span>
          <select id="digitsInput">
            <option value="6">6</option>
            <option value="8">8</option>
          </select>
        </label>
        <label class="field half">
          <span class="field-label">Period (s)</span>
          <input id="periodInput" type="number" value="30" min="1" max="120" />
        </label>
      </div>

      <div id="formError" class="error hidden"></div>

      <button id="saveBtn" class="primary-btn">Save</button>
    </div>
  </div>

  <!-- IMPORT VIEW -->
  <div id="importView" class="view hidden">
    <div class="topbar">
      <button id="importBackBtn" class="icon-btn" title="Back">‹</button>
      <span class="title">Import</span>
      <span class="spacer"></span>
    </div>
    <div class="form">
      <button id="uploadBtn" class="primary-btn">Upload QR image</button>
      <button id="scanBtn" class="ghost-btn">Scan with camera</button>
      <input id="fileInput" type="file" accept="image/*" hidden />

      <div id="importStatus" class="error hidden"></div>
      <div id="importNote" class="note hidden"></div>
      <div id="importPreview" class="import-preview"></div>
      <button id="confirmImportBtn" class="primary-btn hidden"></button>
    </div>
  </div>

  <!-- SETTINGS VIEW -->
  <div id="settingsView" class="view hidden">
    <div class="topbar">
      <button id="settingsBackBtn" class="icon-btn" title="Back">‹</button>
      <span class="title">Settings</span>
      <span class="spacer"></span>
    </div>
    <div class="form">
      <div class="settings-section">
        <div class="settings-label">Change master password</div>
        <input id="changeOldPw" type="password" placeholder="Current password" autocomplete="off" />
        <input id="changeNewPw" type="password" placeholder="New password" autocomplete="off" />
        <button id="changePwBtn" class="primary-btn">Update password</button>
        <div id="changePwMsg" class="error hidden"></div>
      </div>
      <div class="settings-section danger">
        <div class="settings-label">Danger zone</div>
        <button id="settingsLockBtn" class="ghost-btn">Lock now</button>
        <button id="settingsWipeBtn" class="ghost-btn">Reset everything (delete all data)</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
